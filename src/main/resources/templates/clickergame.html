<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clicker Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/clickergame.css">
    <link rel="stylesheet" href="/css/side-panel.css">
    <link rel="stylesheet" href="/css/ai-chat.css">
    <script src="/js/bot.js" defer></script>
    <script src="/js/side-panel.js" defer></script>
</head>

<body>

<button id="toggleBtn" class="nav-toggle chat-game-toggle clicker-chat-toggle" type="button" aria-label="Chat with me" aria-controls="sidePanel" aria-expanded="false">
    <span class="nav-toggle-dot" aria-hidden="true"></span>
    Chat with me
</button>
<th:block th:replace="~{fragments/ai-chat :: panel}"></th:block>

<!-- Opens the upgrade panel -->
<button class="upgrade-toggle" onclick="toggleUpgrades()" aria-label="Open upgrades">
    <img src="game assets/upgrade button.png" alt="" class="cookie-img">
</button>

<div id="upgradePanel" class="upgrade-panel">
    <div class="upgrade-header">
        <h2>Upgrades</h2>
        <button onclick="toggleUpgrades()" class="upgrade-close" aria-label="Close upgrades">&times;</button>
    </div>

    <!-- Upgrade rows are generated by cookieclicker.js -->
    <div id="upgradeList" class="upgrade-list"></div>
</div>

<!-- Cookie count display -->
<div class="d-flex justify-content-center align-items-center flex-column">
    <h1 class="cookie-title">Cookies</h1>
    <div id="cookie-count" class="cookie-count"><b>0</b></div>
    <div id="cookie-power" class="cookie-power">+1 per click</div>
</div>

<!-- Cookie button; floating "+N" popups are appended to the arena -->
<div id="cookieArena" class="cookie-arena d-flex justify-content-center align-items-center">
    <button class="cookie-button" onclick="clicker(event)" aria-label="Click the cookie">
        <img src="game assets/cookie.png"
             alt="Clicker"
             draggable="false"
             class="cookie-img">
    </button>
</div>

<script src="/js/cookieclicker.js"></script>
</body>
</html>
